[project]
name = "pengecekan-kualitas-susu"
version = "2.1.0"
description = "Aplikasi Streamlit untuk klasifikasi kualitas susu menggunakan machine learning"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ihsanul Akram", email = "ihsanulakram@gmail.com" }
]
license = { text = "Apache-2.0" }
keywords = ["streamlit", "machine-learning", "milk-quality", "classification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
